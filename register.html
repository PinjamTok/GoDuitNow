<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoDuitNow - Daftar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1>💰 GoDuitNow</h1>
            <h2>Daftar Akaun Baru</h2>

            <form id="registerForm" onsubmit="event.preventDefault(); register();">
                <div class="form-field">
                    <label>Nama Penuh:</label>
                    <input type="text" id="fullName" placeholder="Ahmad bin Mohamed" required>
                </div>

                <div class="form-field">
                    <label>Email:</label>
                    <input type="email" id="email" placeholder="contoh@email.com" required>
                </div>

                <div class="form-field">
                    <label>Nombor Telefon:</label>
                    <input type="tel" id="phone" placeholder="01234567890" required>
                </div>

                <div class="form-field">
                    <label>MyKad (12 digit):</label>
                    <input type="text" id="ic" placeholder="123456789012" maxlength="12" required>
                </div>

                <div class="form-field">
                    <label>Buat PIN (4-6 digit):</label>
                    <input type="password" id="pin" placeholder="••••" maxlength="6" required>
                </div>

                <div class="form-field">
                    <label>Sahkan PIN:</label>
                    <input type="password" id="confirmPin" placeholder="••••" maxlength="6" required>
                </div>

                <div class="form-field">
                    <label>
                        <input type="checkbox" id="terms" required>
                        Setuju dengan Terma & Syarat
                    </label>
                </div>

                <button type="submit" class="btn-primary">Daftar Sekarang</button>
                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>
            </form>

            <p>Sudah ada akaun? <a href="index.html">Masuk di sini</a></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
