<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoDuitNow - Daftar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="register-box">
            <div class="logo">
                <h1>💰 GoDuitNow</h1>
                <p>Platform Pinjaman Online Terpercaya</p>
            </div>

            <form id="registerForm" class="form-group">
                <h2>Daftar Akaun Baru</h2>

                <div class="form-field">
                    <label for="fullName">Nama Penuh:</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Cth: Ahmad bin Mohamed" required>
                </div>

                <div class="form-field">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
                </div>

                <div class="form-field">
                    <label for="phone">Nombor Telefon:</label>
                    <input type="tel" id="phone" name="phone" placeholder="01234567890" required>
                    <small>Contoh: 01234567890 (tanpa tanda +)</small>
                </div>

                <div class="form-field">
                    <label for="ic">Nombor Kad Pengenalan (MyKad):</label>
                    <input type="text" id="ic" name="ic" placeholder="123456789012" maxlength="12" required>
                    <small>12 digit tanpa tanda (-)</small>
                </div>

                <div class="form-field">
                    <label for="pin">Buat PIN (4-6 digit):</label>
                    <input type="password" id="pin" name="pin" placeholder="••••" maxlength="6" required>
                    <small>PIN digunakan untuk login - Jangan berkongsi dengan orang lain</small>
                </div>

                <div class="form-field">
                    <label for="confirmPin">Sahkan PIN:</label>
                    <input type="password" id="confirmPin" name="confirmPin" placeholder="••••" maxlength="6" required>
                </div>

                <div class="checkbox-field">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">Saya setuju dengan <a href="#" class="link">Terma & Syarat</a> dan <a href="#" class="link">Dasar Privasi</a></label>
                </div>

                <button type="submit" class="btn-primary">Daftar Sekarang</button>

                <div id="successMessage" class="success-message"></div>
                <div id="errorMessage" class="error-message"></div>
            </form>

            <p class="login-prompt">
                Sudah ada akaun? 
                <a href="index.html" class="link">Masuk di sini</a>
            </p>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            register();
        });
    </script>
</body>
</html>
