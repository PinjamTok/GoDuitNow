<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoDuitNow - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1>💰 GoDuitNow</h1>
            <h2>Masuk ke Akaun Anda</h2>

            <form id="loginForm" onsubmit="event.preventDefault(); login();">
                <div class="form-field">
                    <label>Nombor Telefon:</label>
                    <input type="tel" id="phone" placeholder="01234567890" required>
                </div>

                <div class="form-field">
                    <label>PIN:</label>
                    <input type="password" id="pin" placeholder="••••" maxlength="6" required>
                </div>

                <button type="submit" class="btn-primary">Masuk</button>
                <div id="errorMessage" class="error-message"></div>
            </form>

            <p>Belum ada akaun? <a href="register.html">Daftar di sini</a></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
